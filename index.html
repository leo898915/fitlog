<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>轻记 FitLog · 家庭版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue",sans-serif;
    background:linear-gradient(160deg,#e8f5ec 0%,#f6f7f9 60%);color:#1a1d21;
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
  .box{max-width:420px;width:100%;text-align:center}
  .logo{font-size:52px;margin-bottom:10px}
  h1{font-size:26px;font-weight:800;color:#1b5e3a}
  .sub{font-size:14px;color:#5c6b62;margin:8px 0 28px}
  .btn{display:block;background:#1f8a4c;color:#fff;text-decoration:none;
    padding:15px;border-radius:14px;font-size:16px;font-weight:700;margin-bottom:12px;
    box-shadow:0 4px 14px rgba(31,138,76,.25)}
  .btn.ghost{background:#fff;color:#1f8a4a;border:1.5px solid #bcdcc8;box-shadow:none}
  .tip{font-size:12.5px;color:#8a959d;margin-top:18px;line-height:1.7}
</style>
</head>
<body>
  <div class="box">
    <div class="logo">🍃</div>
    <h1>轻记 FitLog</h1>
    <p class="sub">各自记录各自的数据 · 互不干扰<br>无需注册 · 无需登录 · 打开即用</p>
    <a class="btn" href="./轻记FitLog.html">📱 打开轻记</a>
    <a class="btn ghost" href="./使用说明.html">📖 使用说明（先看这个）</a>
    <p class="tip">建议打开后「分享 → 添加到主屏幕」，像 App 一样使用<br>iPhone 用 Safari，安卓用 Chrome/系统浏览器</p>
  </div>
</body>
</html>
